name: Repo Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}
  schedule:
    - cron: '0 0 * * *'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auditoría de estructura del repositorio
        run: |
          set -e
          echo "Iniciando auditoría de repositorio"
          missing=0
          warn=0

          check_required() {
            if [ ! -e "$1" ]; then
              echo "MISSING: $1"
              missing=1
            else
              echo "OK: $1"
            fi
          }

          check_optional() {
            if [ ! -e "$1" ]; then
              echo "WARN: $1 (recommended)"
              warn=1
            else
              echo "OK: $1"
            fi
          }

          # Archivos/carpetas críticos
          check_required frontend/package.json
          check_required README.md
          check_required .gitignore
          check_required backend/requirements.txt

          # Infraestructura/BD
          check_optional backend/app/database.py

          # Código fuente
          check_required frontend/src
          check_required frontend/src/modules
          check_required backend/app/modules

          # Módulos esperados (no obligatorios, se informan si faltan)
          for d in backend/app/modules/cattle backend/app/modules/auth backend/app/modules/reportes frontend/src/modules/ganado frontend/src/modules/auth frontend/src/modules/reportes; do
            if [ -d "$d" ]; then
              echo "OK: $d"
            else
              echo "WARN: falta $d"
            fi
          done

          echo ""
          if [ "$missing" -eq 1 ]; then
            echo "AUDITORÍA FALLIDA: faltan archivos obligatorios. Añade los archivos indicados y vuelve a ejecutar CI."
            exit 1
          fi

          echo "Auditoría completada. Warnings:$warn"

      - name: Ejecutar comprobaciones npm (si existe `package.json`)
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Run npm CI when package.json exists
        run: |
          set -e
          if [ -f frontend/package.json ]; then
            echo "frontend/package.json detectado — ejecutando pipeline npm"
            cd frontend
            npm ci
            npm run lint || true
          else
            echo "frontend/package.json no encontrado — se omiten comprobaciones npm"
          fi