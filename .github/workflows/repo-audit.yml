name: Repo Audit & CI (Portal Equino - Base Sólida)

on:
  push:
    branches: [ main, master, feature/** ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Diagnóstico de Directorios
        run: |
          echo "Estructura detectada en la raíz:"
          ls -F
          echo "-----------------------------------"
          echo "Contenido de 'portal equino':"
          ls -F "portal equino/" || echo "No se pudo acceder a 'portal equino/'"

      - name: Auditoría de Archivos Críticos
        run: |
          set -e
          echo "Verificando integridad de la Base Sólida..."
          
          # Definir archivos obligatorios (Rutas relativas a la raíz del repo)
          # Usamos comillas dobles para manejar el espacio en "portal equino"
          FILES=(
            "portal equino/backend/package.json"
            "portal equino/frontend/package.json"
            "portal equino/README.md"
            "portal equino/.gitignore"
            "portal equino/backend/src/modules/ganado/ganado.routes.ts"
          )

          for file in "${FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ OK: $file"
            else
              echo "❌ ERROR: No se encuentra el archivo: $file"
              exit 1
            fi
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'portal equino/backend/package.json'

      - name: Validar Backend (Oscar)
        working-directory: './portal equino/backend'
        run: |
          npm install
          npm run build

      - name: Validar Frontend (Elian)
        working-directory: './portal equino/frontend'
        run: |
          npm install
          npm run build
