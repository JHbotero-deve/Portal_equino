name: Repo Audit & CI (Portal Equino - Base Sólida)

on:
  push:
    branches: [ main, master, feature/** ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auditoría de Estructura (Base Sólida)
        run: |
          set -e
          echo "Iniciando auditoría de la nueva estructura modular..."
          missing=0

          check_required() {
            if [ ! -e "$1" ]; then
              echo "MISSING: $1"
              missing=1
            else
              echo "OK: $1"
            fi
          }

          # Verificación de la ruta del proyecto principal
          check_required "portal equino/backend/package.json"
          check_required "portal equino/frontend/package.json"
          check_required "portal equino/README.md"
          check_required "portal equino/.gitignore"
          check_required "portal equino/backend/src/modules/ganado/ganado.routes.ts"
          check_required "portal equino/docs/PLAN.md"

          if [ "$missing" -eq 1 ]; then
            echo "AUDITORÍA FALLIDA: La estructura de Portal Equino no cumple los requisitos de Base Sólida."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'portal equino/backend/package.json'

      - name: Build Backend (TypeScript)
        working-directory: './portal equino/backend'
        run: |
          npm install
          npm run build

      - name: Build Frontend (Vite + Tailwind)
        working-directory: './portal equino/frontend'
        run: |
          npm install
          npm run build
