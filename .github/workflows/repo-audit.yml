name: Repo Audit & CI

on:
  push:
    branches: [ main, master, feature/** ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auditoría de estructura del repositorio
        run: |
          set -e
          echo "Iniciando auditoría de repositorio"
          missing=0

          check_required() {
            if [ ! -e "$1" ]; then
              echo "MISSING: $1"
              missing=1
            else
              echo "OK: $1"
            fi
          }

          check_required frontend/package.json
          check_required backend/requirements.txt
          check_required README.md
          check_required .gitignore
          check_required frontend/src/modules/auth
          check_required frontend/src/modules/ganado

          if [ "$missing" -eq 1 ]; then
            echo "AUDITORÍA FALLIDA: faltan archivos obligatorios."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Check (TypeScript Compilation)
        working-directory: ./frontend
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python Syntax Check
        working-directory: ./backend
        run: |
          # Chequeo rápido de errores de sintaxis
          python -m compileall app/
