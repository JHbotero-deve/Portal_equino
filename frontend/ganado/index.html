<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GAVAC — Dashboard Ganadero</title>

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f1f5f9;
    }
    .sidebar-gradient {
      background: linear-gradient(180deg, #064e3b 0%, #065f46 100%);
    }
    .card-modern {
      background: white;
      border: 1px solid #e2e8f0;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card-modern:hover {
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
    }
    .input-dash {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      transition: all 0.2s ease;
    }
    .input-dash:focus {
      background: white;
      border-color: #059669;
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1);
      outline: none;
    }
    .status-badge {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row">

  <!-- Sidebar (Escritorio) -->
  <aside class="w-full md:w-64 sidebar-gradient text-white flex flex-col p-6 space-y-8">
    <div class="flex items-center gap-3 px-2">
      <div class="bg-white/10 p-2 rounded-xl">
        <i data-lucide="layout-dashboard" class="w-6 h-6 text-emerald-300"></i>
      </div>
      <span class="text-xl font-bold tracking-tight">GAVAC</span>
    </div>

    <nav class="flex-1 space-y-2">
      <a href="#" class="flex items-center gap-3 px-4 py-3 bg-white/10 rounded-xl text-emerald-200 font-semibold transition-all">
        <i data-lucide="table-2" class="w-5 h-5"></i>
        Inventario
      </a>
      <a href="/reportes" class="flex items-center gap-3 px-4 py-3 text-white/70 hover:bg-white/5 rounded-xl transition-all">
        <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
        Reportes
      </a>
    </nav>

    <div class="pt-6 border-t border-white/10">
      <div id="api-status-card" class="bg-black/20 rounded-2xl p-4 space-y-2">
        <div class="flex items-center gap-2">
          <span id="api-status-dot" class="w-2 h-2 rounded-full bg-slate-400"></span>
          <span id="api-status-text" class="text-[10px] font-bold uppercase text-white/50">Estado API</span>
        </div>
        <p class="text-xs text-white/80 font-medium">Servidor GAVAC v2</p>
      </div>
    </div>
  </aside>

  <!-- Contenido Principal -->
  <main class="flex-1 p-6 md:p-10 overflow-y-auto">

    <!-- Header -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-4">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">Registro de Ganado</h1>
        <p class="text-slate-500 text-sm">Gestiona y monitorea tu inventario animal en tiempo real.</p>
      </div>
      <div class="flex gap-3 w-full md:w-auto">
        <button onclick="document.getElementById('animal-form').scrollIntoView({behavior: 'smooth'})"
                class="flex-1 md:flex-none bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl font-semibold shadow-lg shadow-emerald-600/20 transition-all flex items-center justify-center gap-2">
          <i data-lucide="plus" class="w-4 h-4"></i>
          Nuevo Animal
        </button>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

      <!-- Panel de Registro -->
      <section class="lg:col-span-1">
        <div class="card-modern rounded-3xl p-6 sticky top-8">
          <h2 class="text-lg font-bold text-slate-900 mb-6 flex items-center gap-2">
            <i data-lucide="clipboard-edit" class="w-5 h-5 text-emerald-600"></i>
            Datos del Animal
          </h2>

          <form id="animal-form" class="space-y-5">
            <div>
              <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-2" for="tag">N.° Chapeta</label>
              <input id="tag" name="tag" type="text" required placeholder="Ej: VACA-123"
                     class="input-dash w-full rounded-xl px-4 py-3 text-sm" />
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-2" for="breed">Raza</label>
                <input id="breed" name="breed" type="text" placeholder="Ej: Holstein"
                       class="input-dash w-full rounded-xl px-4 py-3 text-sm" />
              </div>
              <div>
                <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-2" for="sex">Sexo</label>
                <select id="sex" name="sex" class="input-dash w-full rounded-xl px-4 py-3 text-sm bg-white">
                  <option value="">Selecciona</option>
                  <option value="hembra">Hembra</option>
                  <option value="macho">Macho</option>
                </select>
              </div>
            </div>
            <div>
              <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-2" for="birth_date">Fecha Nacimiento</label>
              <input id="birth_date" name="birth_date" type="date"
                     class="input-dash w-full rounded-xl px-4 py-3 text-sm" />
            </div>

            <div id="form-error" class="text-red-600 text-[11px] font-semibold text-center italic min-h-[1.5rem]"></div>

            <button type="submit" class="w-full bg-slate-900 hover:bg-black text-white py-4 rounded-2xl font-bold transition-all shadow-xl shadow-slate-900/10">
              Registrar en Sistema
            </button>
          </form>
        </div>
      </section>

      <!-- Panel de Listado -->
      <section class="lg:col-span-2 space-y-6">

        <!-- Filtros Rápidos -->
        <div class="card-modern rounded-2xl p-4 flex flex-wrap gap-4 items-center">
            <div class="relative flex-1 min-w-[200px]">
                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                <input id="filter-tag" type="text" placeholder="Filtrar por chapeta..."
                       class="input-dash w-full rounded-xl pl-10 pr-4 py-2 text-xs" />
            </div>
            <input id="filter-breed" type="text" placeholder="Filtrar raza..."
                   class="input-dash rounded-xl px-4 py-2 text-xs w-32" />
            <div class="flex gap-2">
                <button id="filter-btn" class="bg-emerald-50 text-emerald-700 px-4 py-2 rounded-xl text-xs font-bold hover:bg-emerald-100 transition-all">
                    Aplicar
                </button>
                <button id="clear-filter-btn" class="text-slate-400 hover:text-slate-600 px-2 py-2 text-xs font-semibold">
                    Limpiar
                </button>
            </div>
        </div>

        <!-- Tabla -->
        <div class="card-modern rounded-3xl overflow-hidden shadow-sm">
          <div class="overflow-x-auto">
            <table class="w-full border-collapse text-left">
              <thead>
                <tr class="bg-slate-50 border-b border-slate-100">
                  <th class="px-6 py-4 text-[11px] font-bold text-slate-500 uppercase tracking-widest">Identificación</th>
                  <th class="px-6 py-4 text-[11px] font-bold text-slate-500 uppercase tracking-widest">Información</th>
                  <th class="px-6 py-4 text-[11px] font-bold text-slate-500 uppercase tracking-widest">Estado</th>
                  <th class="px-6 py-4 text-[11px] font-bold text-slate-500 uppercase tracking-widest">Operaciones</th>
                </tr>
              </thead>
              <tbody id="animal-table-body" class="divide-y divide-slate-50">
                <!-- Inyectado por JS -->
              </tbody>
            </table>
          </div>

          <div id="empty-state" class="py-20 flex flex-col items-center justify-center text-slate-400 hidden">
            <i data-lucide="ghost" class="w-12 h-12 mb-4 opacity-20"></i>
            <p class="text-sm font-medium">No se encontraron registros de animales.</p>
          </div>
        </div>
      </section>
    </div>

    <footer class="mt-16 text-center">
        <p class="text-xs font-semibold text-slate-400 uppercase tracking-[0.2em]">GAVAC Control System © 2026</p>
    </footer>
  </main>

  <!-- Compilado JS -->
  <script type="module" src="../dist/modules/ganado/main.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
