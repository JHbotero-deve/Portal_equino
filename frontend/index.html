<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAVAC - Acceso Premium</title>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind & Animations -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #065f46, #0f172a);
            overflow: hidden;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .input-gradient:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }
        .btn-emerald-glow {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            box-shadow: 0 4px 15px rgba(5, 150, 105, 0.3);
            transition: all 0.3s ease;
        }
        .btn-emerald-glow:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(5, 150, 105, 0.4);
        }
        .floating {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen relative px-4">

    <!-- Decorative Elements -->
    <div class="absolute top-20 left-20 w-64 h-64 bg-emerald-900/20 rounded-full blur-3xl floating"></div>
    <div class="absolute bottom-20 right-20 w-80 h-80 bg-emerald-800/10 rounded-full blur-3xl floating" style="animation-delay: -2s"></div>

    <div class="glass-card p-10 rounded-3xl w-full max-w-md animate__animated animate__fadeInUp">
        <div class="text-center mb-10">
            <div class="inline-flex p-4 rounded-2xl bg-emerald-500/10 mb-4 border border-emerald-500/20">
                <i data-lucide="layout-dashboard" class="text-emerald-400 w-10 h-10"></i>
            </div>
            <h1 class="text-3xl font-bold text-white tracking-tight">GAVAC</h1>
            <p class="text-emerald-500/70 font-medium text-sm mt-1 uppercase tracking-widest">Enterprise Ganadero</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div class="space-y-2">
                <label class="text-xs font-semibold text-emerald-400/80 uppercase tracking-wider ml-1">Credenciales</label>
                <div class="relative group">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500 group-focus-within:text-emerald-400 transition-colors">
                        <i data-lucide="mail" class="w-5 h-5"></i>
                    </span>
                    <input type="email" id="email" required placeholder="correo@empresa.com"
                        class="w-full bg-slate-900/50 border border-white/5 rounded-2xl pl-12 pr-4 py-4 text-white placeholder-slate-600 outline-none transition-all input-gradient">
                </div>
            </div>

            <div class="space-y-2">
                <div class="relative group">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-500 group-focus-within:text-emerald-400 transition-colors">
                        <i data-lucide="lock" class="w-5 h-5"></i>
                    </span>
                    <input type="password" id="password" required placeholder="Contraseña"
                        class="w-full bg-slate-900/50 border border-white/5 rounded-2xl pl-12 pr-4 py-4 text-white placeholder-slate-600 outline-none transition-all input-gradient">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full btn-emerald-glow text-white font-bold py-4 rounded-2xl transition-all flex items-center justify-center gap-2">
                <span>Acceder al Sistema</span>
                <i data-lucide="arrow-right" class="w-5 h-5"></i>
            </button>
        </form>

        <div class="mt-8 text-center space-y-4">
            <a href="#" id="toggleMode" class="text-slate-400 text-sm hover:text-emerald-400 transition-colors">
                ¿Nuevo en la plataforma? <span class="font-bold text-emerald-500 underline decoration-emerald-500/30">Crea una cuenta</span>
            </a>
            <div id="loginMessage" class="p-3 rounded-xl text-sm font-medium hidden animate__animated animate__shakeX"></div>
        </div>

        <div class="mt-12 pt-8 border-t border-white/5 flex items-center justify-center gap-2">
            <i data-lucide="shield-check" class="w-4 h-4 text-emerald-500/50"></i>
            <span class="text-slate-500 text-[10px] uppercase tracking-widest font-semibold">Secure Core v2.0</span>
        </div>
    </div>

    <script type="module" src="./dist/modules/auth/main.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
